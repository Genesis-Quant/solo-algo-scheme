[project]
name = "scheme"
version = "1.12.9"
description = "Solo research interfaces, strategy assembly and execution."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2,<3",
    "pandas>=2.2,<3",
    "numpy>=2,<3",
    "scipy>=1.14",
    "pyarrow>=21",
    "packaging>=24",
    "loguru>=0.7,<0.8",
    "tushare>=1.4.29,<2",
    "backtest @ git+https://gitee.com/genesis-quant/backtest@f63868467fb2cd974826e311749297b1cba3041d",
    "query @ git+https://gitee.com/genesis-quant/query@e626450026dab87e31b1d74e31c2b1aecafea9ed",
]

[project.scripts]
scheme = "scheme.manage:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
